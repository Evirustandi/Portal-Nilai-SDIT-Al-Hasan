<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const btn = document.getElementById('btn-start');
  const statusEl = document.getElementById('status');

  function log(msg) {
    statusEl.style.display = 'block';
    statusEl.textContent += msg + '\n';
    statusEl.scrollTop = statusEl.scrollHeight;
  }

  btn.addEventListener('click', async () => {
    let configStr = document.getElementById('fb-config').value.trim();
    const githubUrl = document.getElementById('github-url').value.trim();

    if (!configStr || !githubUrl) {
      alert('Mohon lengkapi konfigurasi Firebase dan URL GitHub!');
      return;
    }

    try {
      btn.disabled = true;
      log('--- PROSES DIMULAI ---');

      // MEMBERSIHKAN CONFIG: Mengambil hanya bagian di dalam { ... }
      if (configStr.includes('{')) {
        configStr = configStr.substring(configStr.indexOf('{'), configStr.lastIndexOf('}') + 1);
      }
      
      // Mengubah string menjadi objek JSON yang valid
      // Kita gunakan trik Function untuk menghindari error 'Unexpected Token'
      const config = new Function('return ' + configStr)();

      // 1. Ambil file data.js dari GitHub
      log('Mengambil data dari GitHub...');
      const response = await fetch(githubUrl);
      if (!response.ok) throw new Error('Gagal mengambil file dari GitHub. Pastikan URL Raw benar.');
      const scriptContent = await response.text();

      // 2. Masukkan variabel data ke window global
      const tempScript = document.createElement('script');
      tempScript.textContent = scriptContent;
      document.body.appendChild(tempScript);

      // 3. Inisialisasi Firebase
      const app = initializeApp(config);
      const db = getFirestore(app);

      log('Firebase terhubung. Memulai upload...');

      const collections = [
        { name: 'berita', data: window.CMS_BERITA || [] },
        { name: 'galeri', data: window.CMS_GALERI || [] },
        { name: 'guru', data: window.CMS_GURU || [] },
        { name: 'program', data: window.CMS_PROGRAM || [] },
        { name: 'spmb', data: window.CMS_SPMB || [] },
        { name: 'nilai_siswa', data: window.DATA_NILAI || [] }
      ];

      for (const coll of collections) {
        log(`📂 Memproses ${coll.name} (${coll.data.length} item)...`);
        
        for (let i = 0; i < coll.data.length; i++) {
          const entry = coll.data[i];
          const docId = entry.id || entry.nisn || `item_${i}`;
          
          await setDoc(doc(db, coll.name, String(docId)), entry);
          log(`   ✅ Berhasil: ${coll.name} [ID: ${docId}]`);
        }
      }

      log('--- SEMUA DATA BERHASIL DIPINDAHKAN ---');
      alert('Migrasi Selesai!');

    } catch (err) {
      log('❌ ERROR: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  });
</script>
