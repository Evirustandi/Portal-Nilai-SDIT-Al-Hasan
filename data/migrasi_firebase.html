<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migrasi Data ke Firebase — SDIT Al-Hasan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0D2147;
      --accent: #C8942A;
      --bg: #F0F4FA;
      --white: #ffffff;
      --text: #1A2236;
      --border: #DDE4F0;
    }
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      padding: 20px; 
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container { 
      max-width: 700px; 
      width: 100%;
      background: var(--white); 
      padding: 40px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
    }
    h1 { color: var(--primary); margin-bottom: 10px; font-size: 24px; text-align: center; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 14px; }
    
    .card { 
      border: 1px solid var(--border); 
      padding: 20px; 
      border-radius: 10px; 
      margin-bottom: 20px; 
      background: #F9FBFF; 
    }
    .step-title { 
      font-weight: 700; 
      color: var(--accent); 
      display: block; 
      margin-bottom: 8px;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 1px;
    }
    label { display: block; font-size: 13px; color: #444; margin-bottom: 8px; font-weight: 600;}
    
    textarea, input[type="text"] { 
      width: 100%; 
      font-family: 'Courier New', monospace; 
      padding: 12px; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      box-sizing: border-box; 
      font-size: 13px;
    }
    textarea { height: 120px; resize: vertical; }
    
    .btn-container { text-align: center; margin-top: 30px; }
    button { 
      background: var(--primary); 
      color: white; 
      border: none; 
      padding: 16px 32px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 16px; 
      transition: all 0.3s ease;
      width: 100%;
    }
    button:hover { background: #1A3A6B; transform: translateY(-2px); }
    button:disabled { background: #BCC6D4; cursor: not-allowed; transform: none; }
    
    #status { 
      margin-top: 30px; 
      white-space: pre-wrap; 
      font-family: 'Courier New', monospace; 
      background: #1a1a1a; 
      color: #00ff00; 
      padding: 20px; 
      border-radius: 8px; 
      display: none; 
      max-height: 300px; 
      overflow-y: auto; 
      font-size: 12px;
      border: 2px solid #333;
    }
    .error-msg { color: #ff4444; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>🚀 Firebase Migrator</h1>
  <p class="subtitle">Alat Migrasi Data SDIT Al-Hasan (GitHub ke Firestore)</p>

  <div class="card">
    <span class="step-title">Langkah 1</span>
    <label>Tempelkan seluruh Firebase Config dari Console:</label>
    <textarea id="fb-config" placeholder='const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "...",
  projectId: "...",
  ...
};'></textarea>
  </div>

  <div class="card">
    <span class="step-title">Langkah 2</span>
    <label>Masukkan URL RAW data.js dari GitHub:</label>
    <input type="text" id="github-url" placeholder="https://raw.githubusercontent.com/username/repo/main/data.js">
  </div>

  <div class="btn-container">
    <button id="btn-start">🚀 Mulai Proses Migrasi</button>
  </div>

  <div id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const btn = document.getElementById('btn-start');
  const statusEl = document.getElementById('status');

  function log(msg, isError = false) {
    statusEl.style.display = 'block';
    const div = document.createElement('div');
    if (isError) div.className = 'error-msg';
    div.textContent = msg;
    statusEl.appendChild(div);
    statusEl.scrollTop = statusEl.scrollHeight;
  }

  btn.addEventListener('click', async () => {
    let configInput = document.getElementById('fb-config').value.trim();
    const githubUrl = document.getElementById('github-url').value.trim();

    if (!configInput || !githubUrl) {
      alert('Mohon isi konfigurasi Firebase dan URL GitHub!');
      return;
    }

    statusEl.innerHTML = '';
    btn.disabled = true;

    try {
      log('⏳ Menyiapkan migrasi...');

      // Pembersihan Config agar tidak error "Unexpected token :"
      let configObj;
      try {
        const start = configInput.indexOf('{');
        const end = configInput.lastIndexOf('}');
        if (start === -1 || end === -1) throw new Error('Format salah. Pastikan menyalin tanda { dan }');
        const clean = configInput.substring(start, end + 1);
        configObj = new Function('return ' + clean)();
      } catch (e) {
        throw new Error('Firebase Config tidak valid. Error: ' + e.message);
      }

      log('📡 Mengambil data dari GitHub...');
      const response = await fetch(githubUrl);
      if (!response.ok) throw new Error('Gagal mengambil data dari GitHub. Periksa kembali Link RAW Anda.');
      const code = await response.text();

      // Memasukkan data ke window global
      const script = document.createElement('script');
      script.textContent = code;
      document.body.appendChild(script);

      log('🔥 Menghubungkan ke Firestore...');
      const app = initializeApp(configObj);
      const db = getFirestore(app);

      const mapping = [
        { key: 'CMS_BERITA', col: 'berita' },
        { key: 'CMS_GALERI', col: 'galeri' },
        { key: 'CMS_GURU', col: 'guru' },
        { key: 'CMS_PROGRAM', col: 'program' },
        { key: 'CMS_SPMB', col: 'spmb' },
        { key: 'DATA_NILAI', col: 'nilai_siswa' }
      ];

      for (const item of mapping) {
        const list = window[item.key];
        if (list && Array.isArray(list)) {
          log(`📂 Memproses: ${item.col} (${list.length} data)`);
          for (let i = 0; i < list.length; i++) {
            const row = list[i];
            const id = String(row.id || row.nisn || `auto_${i}`);
            await setDoc(doc(db, item.col, id), row);
            log(`   ✅ Tersimpan ID: ${id}`);
          }
        }
      }

      log('\n✨ SELESAI! Semua data berhasil dipindahkan.');
      alert('Migrasi Berhasil!');
    } catch (err) {
      log('\n❌ ERROR: ' + err.message, true);
    } finally {
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
```
