<meta charset="UTF-8">

<title>Portal Nilai STS — SD IT Al-Hasan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .wrap { width: 100%; max-width: 520px; }
  .header { text-align: center; margin-bottom: 1.5rem; }
  .header .sekolah { font-size: 13px; color: #666; }
  .header h1 { font-size: 22px; font-weight: 700; color: #185FA5; margin: 4px 0 2px; }
  .header .sub { font-size: 13px; color: #888; }
  .card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 1rem; outline: none; transition: border 0.2s; }
  input:focus { border-color: #185FA5; }
  .btn { width: 100%; padding: 11px; background: #185FA5; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #0C447C; }
  .error { background: #fff5f5; border: 1px solid #fcc; color: #c0392b; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 1rem; display: none; }
  .info-siswa { display: flex; align-items: center; gap: 12px; margin-bottom: 1.2rem; padding-bottom: 1rem; border-bottom: 1px solid #eee; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: #E6F1FB; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #185FA5; flex-shrink: 0; }
  .nama { font-size: 16px; font-weight: 600; }
  .kelas { font-size: 13px; color: #888; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 1rem; }
  th { text-align: left; font-size: 12px; color: #888; padding: 6px 8px; border-bottom: 2px solid #eee; }
  td { padding: 9px 8px; border-bottom: 1px solid #f0f0f0; }
  .nilai-num { font-weight: 600; }
  .nilai-tinggi { color: #0F6E56; }
  .nilai-sedang { color: #BA7517; }
  .nilai-rendah { color: #A32D2D; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tuntas { background: #E1F5EE; color: #0F6E56; }
  .belum { background: #FEF0F0; color: #A32D2D; }
  .rata-row td { font-weight: 700; background: #f7f9fc; }
  .back { width: 100%; padding: 9px; background: none; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #666; cursor: pointer; }
  .back:hover { background: #f5f5f5; }
  .warning { background: #fffbea; border: 1px solid #f0d060; color: #7a5c00; border-radius: 8px; padding: 8px 12px; font-size: 12px; margin-bottom: 1rem; display: none; }
  footer { text-align: center; margin-top: 1rem; font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="sekolah">SD Islam Terpadu Al-Hasan — Bojonggenteng</div>
    <h1>Portal Nilai STS</h1>
    <div class="sub">Sumatif Tengah Semester 2 &bull; Tahun Pelajaran 2025/2026</div>
  </div>

  <div class="card" id="form-login">
    <div class="error" id="pesan-error">Data tidak ditemukan. Periksa kembali NISN dan tanggal lahir.</div>
    <label>NISN Siswa</label>
    <input type="text" id="nisn" placeholder="Masukkan NISN siswa" inputmode="numeric" maxlength="12">
    <label>Tanggal Lahir Siswa</label>
    <input type="date" id="tgl-lahir">
    <button class="btn" onclick="cariNilai()">Lihat Nilai</button>
  </div>

  <div class="card" id="hasil" style="display:none">
    <div class="warning" id="pesan-warning"></div>
    <div class="info-siswa">
      <div class="avatar" id="inisial"></div>
      <div>
        <div class="nama" id="nama-siswa"></div>
        <div class="kelas" id="info-kelas"></div>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Mata Pelajaran</th>
          <th style="text-align:center">Nilai</th>
          <th style="text-align:center">KKM</th>
          <th style="text-align:center">Status</th>
        </tr>
      </thead>
      <tbody id="isi-nilai"></tbody>
    </table>
    <button class="back" onclick="kembali()">&#8592; Kembali</button>
  </div>

  <footer>SD IT Al-Hasan &bull; TA 2025/2026</footer>
</div>

function cariNilai() {
  const nisn = document.getElementById('nisn').value.trim();
  const tgl = document.getElementById('tgl-lahir').value;
  const err = document.getElementById('pesan-error');
  err.style.display = 'none';
  const siswa = DATA.find(s => s.nisn === nisn && s.tglLahir === tgl);
  if (!siswa) {
    err.style.display = 'block';
    return;
  }
  tampilkan(siswa);
}

function tampilkan(siswa) {
  document.getElementById('form-login').style.display = 'none';
  document.getElementById('hasil').style.display = 'block';
  const inisial = siswa.nama.split(' ').map(w => w[0]).slice(0,2).join('');
  document.getElementById('inisial').textContent = inisial;
  document.getElementById('nama-siswa').textContent = siswa.nama;
  document.getElementById('info-kelas').textContent = 'Kelas ' + siswa.kelas + ' • NISN: ' + siswa.nisn;
  let total = 0, html = '';
  siswa.nilai.forEach(r => {
    total += r.nilai;
    const cls = r.nilai >= 85 ? 'nilai-tinggi' : r.nilai >= 70 ? 'nilai-sedang' : 'nilai-rendah';
    const tuntas = r.nilai >= r.kkm;
    html += `<tr><td>${r.mapel}</td><td style="text-align:center"><span class="nilai-num ${cls}">${r.nilai}</span></td><td style="text-align:center;color:#aaa">${r.kkm}</td><td style="text-align:center"><span class="badge ${tuntas ? 'tuntas' : 'belum'}">${tuntas ? 'Tuntas' : 'Belum Tuntas'}</span></td></tr>`;
  });
  const rata = Math.round(total / siswa.nilai.length);
  const clsRata = rata >= 85 ? 'nilai-tinggi' : rata >= 70 ? 'nilai-sedang' : 'nilai-rendah';
  html += `<tr class="rata-row"><td>Rata-rata</td><td style="text-align:center"><span class="nilai-num ${clsRata}">${rata}</span></td><td></td><td></td></tr>`;
  document.getElementById('isi-nilai').innerHTML = html;
}

function kembali() {
  document.getElementById('form-login').style.display = 'block';
  document.getElementById('hasil').style.display = 'none';
  document.getElementById('nisn').value = '';
  document.getElementById('tgl-lahir').value = '';
}

document.getElementById('nisn').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') cariNilai();
});
</script>
